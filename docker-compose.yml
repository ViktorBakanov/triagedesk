services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: triagedesk
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d triagedesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD}@db:5432/triagedesk
      GIT_SHA: ${GIT_SHA:?Set GIT_SHA to the current git commit SHA}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  northwind:
    build:
      context: ./northwind
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
