name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t triagedesk-api:ci ./api

      - name: Build Web image
        run: docker build -t triagedesk-web:ci ./web

      - name: Verify API runs as non-root
        run: |
          uid=$(docker run --rm triagedesk-api:ci id -u)
          echo "API container UID: $uid"
          test "$uid" != "0"